pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Single Fabric project. Sources stay in the upstream layout (common/, fabric/)
// and are wired in by build.gradle; neoforge/ is not built.
rootProject.name = 'envelope'
