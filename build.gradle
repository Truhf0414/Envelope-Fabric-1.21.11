plugins {
    // Why: 1.21.11 is the LAST obfuscated MC version. It requires the
    // remap-variant plugin. Do NOT change to 'net.fabricmc.loom' or
    // 'net.fabricmc.fabric-loom' — those are different plugins.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_name
}

repositories {
    maven {
        name = "Fuzs Mod Resources" // Forge Config API Port
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "BlameJared" // JEI
        url = "https://maven.blamejared.com/"
    }
}

// Why: the port keeps upstream's multiloader directory layout (common/, fabric/)
// so upstream diffs stay comparable, but builds them as ONE Fabric project.
// neoforge/ is intentionally not part of any source set.
// Why no splitEnvironmentSourceSets(): upstream mixes client-class imports into
// non-client packages (e.g. Mail.java), exactly as it did under Architectury.
sourceSets {
    main {
        // mortaar/ = vendored Mortaar 1.7.2 (MIT), repackaged to io.github.mortuusars.envelope.lib.mortaar
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java', 'mortaar/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'common/src/generated', 'fabric/src/main/resources', 'mortaar/src/main/resources']
        resources.exclude '.cache/**', 'architectury.common.json', 'hotswap-agent.properties'
    }
    test {
        java.srcDirs = ['common/src/test/java']
        resources.srcDirs = ['common/src/test/resources']
    }
}

loom {
    accessWidenerPath = file("common/src/main/resources/${project.mod_id}.accesswidener")

    runs {
        client {
            programArgs "--username", "Dev"
        }
    }
}

// Port: scripted client tests (Fabric client gametest API). Lives in its own source set (src/gametest) and is not
// part of the mod jar. Run with: gradlew runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "envelope_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Why: Fabric API for 1.21.11 is compiled against the intermediary mapping
    // (class names like class_310, class_304). If you use officialMojangMappings()
    // ALONE, Loom builds a mapping that skips the intermediary layer — the
    // remapped Fabric API jars still contain class_310, but the compiler sees
    // Minecraft mapped to Mojang names, so it fails with:
    //     "class file for net.minecraft.class_310 not found"
    // The fix is a layered mapping: first lay down intermediary, then overlay
    // Mojang names. This produces a full 3-column mapping that Loom can use
    // to correctly remap Fabric API from class_310 -> Minecraft.
    mappings loom.layered {
        mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
        officialMojangMappings()
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    // JEI is optional at runtime; upstream also compiles against JEI internals (mixins into JEI).
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common:${project.jei_version}"
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-lib:${project.jei_version}"
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-gui:${project.jei_version}"
    // Why no JEI at dev runtime: jei-fabric 27.54 is built with Loom 1.17.20 and the
    // validated Loom 1.16.2 refuses to remap it. JEI is tested in the Prism instance instead.

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Port: run the built (remapped) jar the way players and servers will, outside the dev environment.
//   gradlew prodServer          - real dedicated server in run/prodServer (set its ports in server.properties first)
//   gradlew prodClientGameTest  - real client running the scripted tests from src/gametest against the built jar
configurations {
    productionRuntimeMods
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
}

def gametestJar = tasks.register("gametestJar", Jar) {
    from sourceSets.gametest.output
    archiveClassifier = "gametest-dev"
    destinationDirectory = layout.buildDirectory.dir("devlibs")
}

def remapGametestJar = tasks.register("remapGametestJar", net.fabricmc.loom.task.RemapJarTask) {
    inputFile = gametestJar.flatMap { it.archiveFile }
    classpath.from(sourceSets.gametest.compileClasspath)
    archiveClassifier = "gametest"
    addNestedDependencies = false
    destinationDirectory = layout.buildDirectory.dir("testlibs")
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.from(configurations.productionRuntimeMods)
    runDir = file("run/prodServer")
}

tasks.register("prodClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.productionRuntimeMods)
    mods.from(remapGametestJar)
    jvmArgs.add("-Dfabric.client.gametest")
    runDir = file("run/prodClientGameTest")
}

// Joins a dedicated server that is already running in another process (gradlew prodServer) on 127.0.0.1:25599.
tasks.register("prodClientJoinServer", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.productionRuntimeMods)
    mods.from(remapGametestJar)
    jvmArgs.add("-Dfabric.client.gametest")
    jvmArgs.add("-Denvelope.test.externalServer=127.0.0.1:25599")
    // The gametest API normally keeps client and server in step; with a server in another process it cannot,
    // and it asks for this switch.
    jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
    runDir = file("run/prodClientJoinServer")
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    def expandProps = [
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_version      : project.mod_version,
            mod_authors      : project.mod_authors,
            mod_description  : project.mod_description,
            mod_issues       : project.mod_issues,
            mod_page         : project.mod_page,
            mod_github       : project.mod_github,
            mod_license      : project.mod_license,
            maven_group      : project.maven_group
    ]
    inputs.properties(expandProps)
    filteringCharset "UTF-8"
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    // Why: during the port we want the full error list, not javac's default first 100.
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

jar {
    from("LICENSE.md") {
        rename { "LICENSE_${project.base.archivesName.get()}.md" }
    }
    from("mortaar/LICENSE.md") {
        rename { "LICENSE_mortaar.md" }
    }
}
